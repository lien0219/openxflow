<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve the theme before styles and application modules can paint.
      (() => {
        const readPreference = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const appearances = {
          classic: null,
          nebula: "dark",
          polar: "light",
          terminal: "dark",
          bloom: "light",
          aurora: "dark",
        };
        const storedPreset = readPreference("themePreset");
        const preset = Object.prototype.hasOwnProperty.call(
          appearances,
          storedPreset,
        )
          ? storedPreset
          : "classic";
        const preference = readPreference("themePreference");
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const appearance = appearances[preset] || (dark ? "dark" : "light");
        const root = document.documentElement;
        root.classList.toggle("dark", appearance === "dark");
        root.dataset.theme = preset;
        root.dataset.appearance = appearance;
        root.style.colorScheme = appearance;
      })();
    </script>
    <style>
      html {
        background: hsl(var(--background, 0 0% 100%));
      }
      html.dark {
        background: hsl(var(--background, 240 6% 10%));
      }
    </style>
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />
    <script
      src="/node_modules/ace-builds/src-min-noconflict/ace.js"
      type="module"
    ></script>
    <title>OpenXFlow</title>
  </head>
  <body id="body" style="width: 100%; height: 100%">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div style="width: 100vw; height: 100vh" id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
