name: Channel Production Frontend

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: channel-production-frontend
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out channel branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Apply production channel UI integration
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/patch_channel_frontend_rollout.py
          python .github/scripts/apply_channel_frontend_production_ui.py \
            2>&1 | tee /tmp/channel-frontend-apply.log

      - name: Upload application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-frontend-apply
          path: /tmp/channel-frontend-apply.log
          if-no-files-found: error
          retention-days: 3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts --loglevel=error

      - name: Format production channel UI
        working-directory: src/frontend
        run: |
          npx --no-install biome format --write \
            src/controllers/API/queries/channels \
            src/pages/SettingsPage/pages/ChannelsPage \
            tsconfig.channels.json

      - name: Check production channel UI
        working-directory: src/frontend
        shell: bash
        run: |
          set -o pipefail
          npx --no-install biome check \
            src/controllers/API/queries/channels \
            src/pages/SettingsPage/pages/ChannelsPage \
            tsconfig.channels.json \
            2>&1 | tee /tmp/channel-production-frontend-biome.log

      - name: Upload Biome diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-frontend-biome
          path: /tmp/channel-production-frontend-biome.log
          if-no-files-found: error
          retention-days: 3

      - name: Run Channel Center tests
        working-directory: src/frontend
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            --runInBand \
            src/pages/SettingsPage/pages/ChannelsPage/__tests__/utils.test.ts \
            src/pages/SettingsPage/pages/ChannelsPage/__tests__/i18n.test.ts \
            src/pages/SettingsPage/pages/ChannelsPage/__tests__/production-ui-contract.test.ts \
            2>&1 | tee /tmp/channel-production-frontend-tests.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-frontend-tests
          path: /tmp/channel-production-frontend-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Type-check Channel Center
        working-directory: src/frontend
        shell: bash
        run: |
          set +e
          npx --no-install tsc --noEmit --pretty false --project tsconfig.channels.json \
            2>&1 | tee /tmp/channel-production-frontend-tsc.log
          tsc_status=${PIPESTATUS[0]}
          set -e

          channel_error_pattern='^src/(controllers/API/queries/channels|pages/SettingsPage/pages/ChannelsPage).*error TS[0-9]+:'
          if grep -E "$channel_error_pattern" /tmp/channel-production-frontend-tsc.log; then
            echo "Channel Center type errors detected."
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            echo "::warning::TypeScript reported pre-existing errors in imported shared modules."
          fi

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-frontend-tsc
          path: /tmp/channel-production-frontend-tsc.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove one-shot frontend rollout resources
        run: |
          rm -f .github/scripts/apply_channel_frontend_production_ui.py
          rm -f .github/scripts/patch_channel_frontend_rollout.py
          rm -f .github/workflows/channel-production-frontend.yml

      - name: Commit production Channel Center UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): complete production channel management UI"
          git pull --rebase origin feature/channel-gateway
          git push origin HEAD:feature/channel-gateway
