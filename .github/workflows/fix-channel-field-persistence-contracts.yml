name: Fix Channel Field Persistence Contracts

on:
  push:
    branches:
      - feature/channel-gateway
    paths:
      - ".github/workflows/fix-channel-field-persistence-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-channel-field-persistence-contracts
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src/backend/base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply field persistence hardening
        run: python .github/scripts/fix_channel_field_persistence_contracts.py

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            src/backend/base/pyproject.toml

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Ruff changed production and test files
        run: |
          uvx --quiet ruff check --config src/backend/base/langflow/channels/ruff.toml --output-format concise \
            src/backend/base/langflow/channels/services/commands.py
          uvx --quiet ruff check --config src/backend/tests/unit/channels/ruff.toml --output-format concise \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_channel_connection_flow_selection_persistence.py \
            src/backend/tests/unit/channels/test_channel_command_field_persistence.py

      - name: Run persistence regression tests
        run: >-
          uv run --frozen --project src/backend/base --group dev
          pytest -q --tb=short
          --confcutdir=src/backend/tests/unit/channels
          src/backend/tests/unit/channels/test_channel_connection_flow_selection_persistence.py
          src/backend/tests/unit/channels/test_channel_command_field_persistence.py
          src/backend/tests/unit/channels/test_models.py

      - name: Compile changed modules
        run: >-
          python -m compileall -q
          src/backend/base/langflow/channels/services/commands.py
          src/backend/base/langflow/services/database/models/channel/crud.py
          src/backend/tests/unit/channels/test_channel_connection_flow_selection_persistence.py
          src/backend/tests/unit/channels/test_channel_command_field_persistence.py

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(channels): preserve all configurable fields"
          git push origin HEAD:feature/channel-gateway
