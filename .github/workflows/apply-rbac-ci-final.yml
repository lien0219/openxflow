name: Apply RBAC CI Final Fixes

on:
  pull_request:
    branches:
      - feature/channel-gateway
    paths:
      - ".github/workflows/apply-rbac-ci-final.yml"

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/rbac-ci-final-2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out temporary fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Apply focused source fixes
        shell: python
        run: |
          from pathlib import Path

          team_roles = Path("src/backend/base/langflow/services/authorization/team_roles.py")
          text = team_roles.read_text(encoding="utf-8")
          old = '''from dataclasses import dataclass
          from uuid import UUID

          from sqlalchemy.exc import IntegrityError
          from sqlmodel import select
          from sqlmodel.ext.asyncio.session import AsyncSession
          '''
          new = '''from dataclasses import dataclass
          from typing import TYPE_CHECKING
          from uuid import UUID

          from sqlalchemy.exc import IntegrityError
          from sqlmodel import select

          if TYPE_CHECKING:
              from sqlmodel.ext.asyncio.session import AsyncSession
          '''
          if old not in text:
              raise SystemExit("team_roles import block not found")
          team_roles.write_text(text.replace(old, new, 1), encoding="utf-8")

          settings_page = Path("src/frontend/src/pages/SettingsPage/index.tsx")
          text = settings_page.read_text(encoding="utf-8")
          old = "export default function SettingsPage(): JSX.Element {"
          if old not in text:
              raise SystemExit("SettingsPage return annotation not found")
          settings_page.write_text(
              text.replace(old, "export default function SettingsPage() {", 1),
              encoding="utf-8",
          )

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts --loglevel=error

      - name: Apply Biome import organization
        working-directory: src/frontend
        run: >-
          npx --no-install biome check --write
          src/pages/SettingsPage/pages/PermissionsPage/components/AuditTab.tsx
          src/pages/SettingsPage/pages/PermissionsPage/components/RolesTab.tsx
          src/pages/SettingsPage/pages/PermissionsPage/components/SharesTab.tsx
          src/pages/SettingsPage/pages/PermissionsPage/components/TeamsTab.tsx

      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "openxflow-ci"
          git config user.email "openxflow-ci@users.noreply.github.com"
          git add \
            src/backend/base/langflow/services/authorization/team_roles.py \
            src/frontend/src/pages/SettingsPage/index.tsx \
            src/frontend/src/pages/SettingsPage/pages/PermissionsPage/components/AuditTab.tsx \
            src/frontend/src/pages/SettingsPage/pages/PermissionsPage/components/RolesTab.tsx \
            src/frontend/src/pages/SettingsPage/pages/PermissionsPage/components/SharesTab.tsx \
            src/frontend/src/pages/SettingsPage/pages/PermissionsPage/components/TeamsTab.tsx
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "fix(rbac): finalize permission center checks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
