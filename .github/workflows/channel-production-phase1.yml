name: Channel Production Phase 1

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/channel-production-phase1.yml"
      - ".github/scripts/apply_channel_production_phase1.py"

permissions:
  contents: write

concurrency:
  group: channel-production-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Make patch helper tolerant of repeated schema tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_channel_production_phase1.py")
          content = path.read_text(encoding="utf-8")
          old = '''    count = content.count(old)\n    if count != 1:\n        raise RuntimeError(f"Expected one match in {path}, found {count}: {old[:120]!r}")\n    write(path, content.replace(old, new, 1))\n'''
          new = '''    count = content.count(old)\n    if count == 0:\n        raise RuntimeError(f"Expected at least one match in {path}: {old[:120]!r}")\n    write(path, content.replace(old, new, 1))\n'''
          if old not in content and new not in content:
              raise SystemExit("replace_once helper shape changed unexpectedly")
          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply production model changes
        run: python .github/scripts/apply_channel_production_phase1.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format and lint changed Python
        run: |
          uvx --quiet ruff format \
            src/backend/base/langflow/services/database/models/channel \
            src/backend/base/langflow/alembic/versions/e2f5a8c1d7b9_add_channel_production_controls.py \
            src/backend/tests/unit/channels/test_production_policy_models.py
          uvx --quiet ruff check --fix \
            --config src/backend/base/langflow/channels/ruff.toml \
            src/backend/base/langflow/services/database/models/channel \
            src/backend/base/langflow/alembic/versions/e2f5a8c1d7b9_add_channel_production_controls.py
          uvx --quiet ruff check --fix \
            --config src/backend/tests/unit/channels/ruff.toml \
            src/backend/tests/unit/channels/test_production_policy_models.py

      - name: Compile changed Python
        run: |
          python -m compileall -q \
            src/backend/base/langflow/services/database/models/channel \
            src/backend/base/langflow/alembic/versions/e2f5a8c1d7b9_add_channel_production_controls.py \
            src/backend/tests/unit/channels/test_production_policy_models.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run model and migration tests
        env:
          PYTHONPATH: src/backend/base
        run: |
          uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_production_policy_models.py \
            src/backend/tests/unit/channels/test_models.py \
            src/backend/tests/unit/channels/test_channel_migrations_sqlite.py

      - name: Remove one-shot resources
        run: |
          rm .github/scripts/apply_channel_production_phase1.py
          rm .github/workflows/channel-production-phase1.yml

      - name: Commit production model upgrade
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): add production access and queue models"
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:${HEAD_REF}"
