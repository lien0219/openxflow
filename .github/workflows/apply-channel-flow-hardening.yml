name: Apply Channel Flow Hardening

on:
  push:
    branches:
      - automation/channel-flow-hardening
    paths:
      - ".github/scripts/apply_channel_flow_hardening.py"
      - ".github/scripts/fix_channel_flow_hardening_generator.py"
      - ".github/workflows/apply-channel-flow-hardening.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/scripts/apply_channel_flow_hardening.py"
      - ".github/scripts/fix_channel_flow_hardening_generator.py"
      - ".github/workflows/apply-channel-flow-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-channel-flow-hardening
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: src/backend/base
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: automation/channel-flow-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            src/backend/base/pyproject.toml

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Fix generator compatibility
        run: python .github/scripts/fix_channel_flow_hardening_generator.py

      - name: Apply production hardening
        run: python .github/scripts/apply_channel_flow_hardening.py

      - name: Format backend changes
        run: >-
          uvx --quiet ruff format
          src/backend/base/langflow/channels
          src/backend/base/langflow/api/v1/channel_management.py
          src/backend/base/langflow/api/v1/channel_runtime.py
          src/backend/base/langflow/api/v1/channel_webhooks.py
          src/backend/base/langflow/services/database/models/channel
          src/backend/base/langflow/alembic/versions/b2c5f8a1d4e7_harden_channel_flow_selections.py
          src/backend/tests/unit/channels

      - name: Ruff production channel code
        run: >-
          uvx --quiet ruff check
          --config src/backend/base/langflow/channels/ruff.toml
          --output-format concise
          src/backend/base/langflow/channels

      - name: Ruff channel tests
        run: >-
          uvx --quiet ruff check
          --config src/backend/tests/unit/channels/ruff.toml
          --output-format concise
          src/backend/tests/unit/channels

      - name: Ruff API, model and migration changes
        run: >-
          uvx --quiet ruff check
          --config pyproject.toml
          --extend-ignore EM101,TRY003
          --output-format concise
          src/backend/base/langflow/api/v1/channel_management.py
          src/backend/base/langflow/api/v1/channel_runtime.py
          src/backend/base/langflow/api/v1/channel_webhooks.py
          src/backend/base/langflow/services/database/models/channel/model.py
          src/backend/base/langflow/services/database/models/channel/flow_selection_model.py
          src/backend/base/langflow/alembic/versions/b2c5f8a1d4e7_harden_channel_flow_selections.py

      - name: Compile backend changes
        run: >-
          python -m compileall -q
          src/backend/base/langflow/channels
          src/backend/base/langflow/api/v1/channel_management.py
          src/backend/base/langflow/api/v1/channel_runtime.py
          src/backend/base/langflow/api/v1/channel_webhooks.py
          src/backend/base/langflow/services/database/models/channel
          src/backend/base/langflow/alembic/versions/b2c5f8a1d4e7_harden_channel_flow_selections.py
          src/backend/tests/unit/channels

      - name: Run workflow-selection and migration regression tests
        run: >-
          uv run --frozen --project src/backend/base --group dev
          pytest -q --tb=short
          --confcutdir=src/backend/tests/unit/channels
          src/backend/tests/unit/channels/test_channel_flow_selection.py
          src/backend/tests/unit/channels/test_channel_flow_hardening.py
          src/backend/tests/unit/channels/test_channel_runtime.py
          src/backend/tests/unit/channels/test_channel_migrations_sqlite.py
          src/backend/tests/unit/channels/test_channel_capabilities_policy.py
          src/backend/tests/unit/channels/test_dispatch.py
          src/backend/tests/unit/channels/test_system_commands.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts --loglevel=error

      - name: Format frontend changes
        working-directory: src/frontend
        run: >-
          npx --no-install biome check --write
          src/controllers/API/queries/channels
          src/pages/SettingsPage/pages/ChannelsPage

      - name: Check frontend formatting
        working-directory: src/frontend
        run: >-
          npx --no-install biome check
          src/controllers/API/queries/channels
          src/pages/SettingsPage/pages/ChannelsPage
          tsconfig.channels.json

      - name: Type-check focused frontend
        working-directory: src/frontend
        shell: bash
        run: |
          set +e
          npx --no-install tsc --noEmit --pretty false --project tsconfig.channels.json 2>&1 | tee /tmp/channel-flow-tsc.log
          tsc_status=${PIPESTATUS[0]}
          set -e
          focused_error_pattern='^src/(controllers/API/queries/channels|pages/SettingsPage/pages/ChannelsPage).*error TS[0-9]+:'
          if grep -E "$focused_error_pattern" /tmp/channel-flow-tsc.log; then
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            echo "::warning::TypeScript reported pre-existing errors in imported shared modules."
          fi

      - name: Run Channel Center unit tests
        working-directory: src/frontend
        run: >-
          npm test --
          --runInBand
          src/pages/SettingsPage/pages/ChannelsPage/__tests__/utils.test.ts
          src/pages/SettingsPage/pages/ChannelsPage/__tests__/i18n.test.ts
          src/pages/SettingsPage/pages/ChannelsPage/__tests__/production-ui-contract.test.ts

      - name: Remove one-time automation files
        run: |
          rm -f .github/scripts/apply_channel_flow_hardening.py
          rm -f .github/scripts/fix_channel_flow_hardening_generator.py
          rm -f .github/workflows/apply-channel-flow-hardening.yml

      - name: Commit validated result
        run: |
          git config user.name "openxflow-automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): harden persistent workflow selection"
          git push origin HEAD:automation/channel-flow-hardening
