name: Channel Acceptance Round 2 Fixes

on:
  push:
    branches:
      - feature/channel-gateway
    paths:
      - .github/workflows/channel-acceptance-round2-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Apply acceptance fixes
        run: python .github/scripts/apply_channel_round2.py

      - name: Validate patched source syntax
        run: |
          python -m compileall -q \
            src/backend/base/langflow/channels/services \
            src/backend/base/langflow/services/database/models/channel \
            src/backend/tests/unit/channels

      - name: Commit fixes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(channels): address second acceptance findings"
          git push origin HEAD:feature/channel-gateway
