name: Channel Production Service Identity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: channel-production-service-identity
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out channel branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Apply managed service identity runtime
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_channel_service_identity.py 2>&1 | tee /tmp/channel-service-identity-apply.log
          python .github/scripts/patch_channel_service_identity.py 2>&1 | tee -a /tmp/channel-service-identity-apply.log

      - name: Upload application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-service-identity-apply-diagnostics
          path: /tmp/channel-service-identity-apply.log
          if-no-files-found: error
          retention-days: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format managed identity runtime
        run: |
          uvx --quiet ruff format \
            src/backend/base/langflow/channels/services/service_identity.py \
            src/backend/base/langflow/channels/services/access_control.py \
            src/backend/base/langflow/channels/services/dispatch.py \
            src/backend/base/langflow/channels/services/workflow.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/tests/unit/channels/test_channel_service_identity.py

      - name: Lint managed identity runtime
        shell: bash
        run: |
          set -o pipefail
          {
            uvx --quiet ruff check --fix \
              --config src/backend/base/langflow/channels/ruff.toml \
              src/backend/base/langflow/channels/services/service_identity.py \
              src/backend/base/langflow/channels/services/access_control.py \
              src/backend/base/langflow/channels/services/dispatch.py \
              src/backend/base/langflow/channels/services/workflow.py \
              src/backend/base/langflow/services/database/models/channel/crud.py \
              src/backend/base/langflow/api/v1/channels.py
            uvx --quiet ruff check --fix \
              --config src/backend/tests/unit/channels/ruff.toml \
              src/backend/tests/unit/channels/test_channel_service_identity.py
          } 2>&1 | tee /tmp/channel-service-identity-ruff.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-service-identity-ruff-diagnostics
          path: /tmp/channel-service-identity-ruff.log
          if-no-files-found: error
          retention-days: 3

      - name: Compile managed identity runtime
        run: |
          python -m compileall -q \
            src/backend/base/langflow/channels/services/service_identity.py \
            src/backend/base/langflow/channels/services/access_control.py \
            src/backend/base/langflow/channels/services/dispatch.py \
            src/backend/base/langflow/channels/services/workflow.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/tests/unit/channels/test_channel_service_identity.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run managed identity regression tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src/backend/base uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_channel_service_identity.py \
            src/backend/tests/unit/channels/test_channel_access_principals.py \
            src/backend/tests/unit/channels/test_production_access_context.py \
            src/backend/tests/unit/channels/test_dispatch.py \
            src/backend/tests/unit/channels/test_workflow_response.py \
            src/backend/tests/unit/channels/test_channel_core_workflow.py \
            src/backend/tests/unit/channels/test_models.py \
            2>&1 | tee /tmp/channel-service-identity-pytest.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-service-identity-pytest-diagnostics
          path: /tmp/channel-service-identity-pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove one-shot rollout resources
        run: |
          rm -f .github/scripts/apply_channel_service_identity.py
          rm -f .github/scripts/patch_channel_service_identity.py
          rm -f .github/workflows/channel-production-service-identity.yml

      - name: Commit managed service identity runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): provision least-privileged service identities"
          git pull --rebase origin feature/channel-gateway
          git push origin HEAD:feature/channel-gateway
