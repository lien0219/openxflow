name: Channel CI Five-Check Repair

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/channel-gateway

permissions:
  contents: write

concurrency:
  group: channel-ci-five-check-repair-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply all five CI repairs
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_channel_provider_security.py \
            2>&1 | tee /tmp/channel-ci-five-apply.log

      - name: Upload application diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: channel-ci-five-apply
          path: /tmp/channel-ci-five-apply.log
          if-no-files-found: warn
          retention-days: 3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format and lint provider runtime
        shell: bash
        run: |
          uvx --quiet ruff format \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/channels/adapters/dingtalk.py \
            src/backend/base/langflow/channels/adapters/factory.py \
            src/backend/base/langflow/channels/adapters/feishu.py \
            src/backend/base/langflow/channels/adapters/telegram.py \
            src/backend/base/langflow/channels/adapters/wecom.py \
            src/backend/base/langflow/channels/security/provider_credentials.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_provider_credentials.py \
            src/backend/tests/unit/channels/test_wecom.py
          uvx --quiet ruff check --fix --config src/backend/base/pyproject.toml \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/services/database/models/channel/crud.py
          uvx --quiet ruff check --fix --config src/backend/base/langflow/channels/ruff.toml \
            src/backend/base/langflow/channels/adapters/dingtalk.py \
            src/backend/base/langflow/channels/adapters/factory.py \
            src/backend/base/langflow/channels/adapters/feishu.py \
            src/backend/base/langflow/channels/adapters/telegram.py \
            src/backend/base/langflow/channels/adapters/wecom.py \
            src/backend/base/langflow/channels/security/provider_credentials.py
          uvx --quiet ruff check --fix --config src/backend/tests/unit/channels/ruff.toml \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_provider_credentials.py \
            src/backend/tests/unit/channels/test_wecom.py

      - name: Compile provider runtime
        run: |
          python -m compileall -q \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/channels/adapters \
            src/backend/base/langflow/channels/security/provider_credentials.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_provider_credentials.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run provider and gateway regression tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src/backend/base uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_provider_credentials.py \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_telegram.py \
            src/backend/tests/unit/channels/test_feishu.py \
            src/backend/tests/unit/channels/test_feishu_encrypted_adapter.py \
            src/backend/tests/unit/channels/test_dingtalk.py \
            src/backend/tests/unit/channels/test_dingtalk_session_webhook_security.py \
            src/backend/tests/unit/channels/test_dingtalk_download_security.py \
            src/backend/tests/unit/channels/test_wecom.py \
            src/backend/tests/unit/channels/test_wecom_crypto.py \
            src/backend/tests/unit/channels/test_wecom_aes_key.py \
            src/backend/tests/unit/channels/test_wecom_retry.py \
            src/backend/tests/unit/channels/test_adapter_factory.py \
            src/backend/tests/unit/channels/test_resilient_adapters.py \
            src/backend/tests/unit/channels/test_security.py \
            src/backend/tests/unit/channels/test_webhook_body_limit.py \
            src/backend/tests/unit/channels/test_gateway.py \
            src/backend/tests/unit/channels/test_channel_core_workflow.py \
            2>&1 | tee /tmp/channel-ci-five-pytest.log

      - name: Upload backend diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: channel-ci-five-pytest
          path: /tmp/channel-ci-five-pytest.log
          if-no-files-found: warn
          retention-days: 3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts --loglevel=error

      - name: Format and validate frontend repairs
        working-directory: src/frontend
        shell: bash
        run: |
          FILES=(
            src/pages/SettingsPage/pages/ChannelsPage/components/ChannelConnectionDialog.tsx
            tests/core/features/auto-login-off.spec.ts
            tests/core/features/user-flow-state-cleanup.spec.ts
            tests/core/features/user-progress-track.spec.ts
            tests/core/regression/general-bugs-remove-session-after-logout.spec.ts
            tests/utils/add-new-user-and-loggin.ts
          )
          npx --no-install biome format --write "${FILES[@]}"
          npx --no-install biome check "${FILES[@]}"
          npm test -- --runInBand \
            src/pages/SettingsPage/pages/ChannelsPage/__tests__/production-ui-contract.test.ts

      - name: Remove one-shot repair resources
        run: |
          rm -f .github/scripts/apply_channel_provider_security.py
          rm -f .github/scripts/patch_channel_provider_security_rollout.py
          rm -f .github/workflows/channel-production-provider-security.yml

      - name: Commit complete five-check repair
        shell: bash
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): resolve channel security and flaky workflow checks"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
