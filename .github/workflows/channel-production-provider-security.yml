name: Channel Production Provider Security

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: channel-production-provider-security
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out channel branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Apply provider security hardening
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/apply_channel_provider_security.py \
            2>&1 | tee /tmp/channel-provider-security-apply.log

      - name: Upload application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-provider-security-apply
          path: /tmp/channel-provider-security-apply.log
          if-no-files-found: error
          retention-days: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format provider security runtime
        run: |
          uvx --quiet ruff format \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/channels/adapters/dingtalk.py \
            src/backend/base/langflow/channels/adapters/factory.py \
            src/backend/base/langflow/channels/adapters/feishu.py \
            src/backend/base/langflow/channels/adapters/telegram.py \
            src/backend/base/langflow/channels/adapters/wecom.py \
            src/backend/base/langflow/channels/security/provider_credentials.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_dingtalk.py \
            src/backend/tests/unit/channels/test_feishu.py \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_provider_credentials.py \
            src/backend/tests/unit/channels/test_telegram.py \
            src/backend/tests/unit/channels/test_wecom.py

      - name: Lint provider security runtime
        shell: bash
        run: |
          set -o pipefail
          {
            uvx --quiet ruff check --fix \
              --config src/backend/base/pyproject.toml \
              src/backend/base/langflow/api/v1/channels.py \
              src/backend/base/langflow/services/database/models/channel/crud.py
            uvx --quiet ruff check --fix \
              --config src/backend/base/langflow/channels/ruff.toml \
              src/backend/base/langflow/channels/adapters/dingtalk.py \
              src/backend/base/langflow/channels/adapters/factory.py \
              src/backend/base/langflow/channels/adapters/feishu.py \
              src/backend/base/langflow/channels/adapters/telegram.py \
              src/backend/base/langflow/channels/adapters/wecom.py \
              src/backend/base/langflow/channels/security/provider_credentials.py
            uvx --quiet ruff check --fix \
              --config src/backend/tests/unit/channels/ruff.toml \
              src/backend/tests/unit/channels/test_dingtalk.py \
              src/backend/tests/unit/channels/test_feishu.py \
              src/backend/tests/unit/channels/test_provider_adapter_security.py \
              src/backend/tests/unit/channels/test_provider_credentials.py \
              src/backend/tests/unit/channels/test_telegram.py \
              src/backend/tests/unit/channels/test_wecom.py
          } 2>&1 | tee /tmp/channel-provider-security-ruff.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-provider-security-ruff
          path: /tmp/channel-provider-security-ruff.log
          if-no-files-found: error
          retention-days: 3

      - name: Compile provider security runtime
        run: |
          python -m compileall -q \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/channels/adapters \
            src/backend/base/langflow/channels/security/provider_credentials.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_provider_credentials.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run provider security and gateway regression tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src/backend/base uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_provider_credentials.py \
            src/backend/tests/unit/channels/test_provider_adapter_security.py \
            src/backend/tests/unit/channels/test_telegram.py \
            src/backend/tests/unit/channels/test_feishu.py \
            src/backend/tests/unit/channels/test_feishu_encrypted_adapter.py \
            src/backend/tests/unit/channels/test_dingtalk.py \
            src/backend/tests/unit/channels/test_dingtalk_session_webhook_security.py \
            src/backend/tests/unit/channels/test_dingtalk_download_security.py \
            src/backend/tests/unit/channels/test_wecom.py \
            src/backend/tests/unit/channels/test_wecom_crypto.py \
            src/backend/tests/unit/channels/test_wecom_aes_key.py \
            src/backend/tests/unit/channels/test_wecom_retry.py \
            src/backend/tests/unit/channels/test_adapter_factory.py \
            src/backend/tests/unit/channels/test_resilient_adapters.py \
            src/backend/tests/unit/channels/test_security.py \
            src/backend/tests/unit/channels/test_webhook_body_limit.py \
            src/backend/tests/unit/channels/test_gateway.py \
            src/backend/tests/unit/channels/test_channel_core_workflow.py \
            2>&1 | tee /tmp/channel-provider-security-pytest.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-provider-security-pytest
          path: /tmp/channel-provider-security-pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --ignore-scripts --loglevel=error

      - name: Format and test provider credential UI
        working-directory: src/frontend
        shell: bash
        run: |
          set -o pipefail
          npx --no-install biome format --write \
            src/pages/SettingsPage/pages/ChannelsPage/components/ChannelConnectionDialog.tsx
          npx --no-install biome check \
            src/pages/SettingsPage/pages/ChannelsPage/components/ChannelConnectionDialog.tsx
          npm test -- \
            --runInBand \
            src/pages/SettingsPage/pages/ChannelsPage/__tests__/production-ui-contract.test.ts \
            2>&1 | tee /tmp/channel-provider-security-frontend.log

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-provider-security-frontend
          path: /tmp/channel-provider-security-frontend.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove one-shot provider security resources
        run: |
          rm -f .github/scripts/apply_channel_provider_security.py
          rm -f .github/workflows/channel-production-provider-security.yml

      - name: Commit provider security hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): harden provider callbacks and credential validation"
          git pull --rebase origin feature/channel-gateway
          git push origin HEAD:feature/channel-gateway
