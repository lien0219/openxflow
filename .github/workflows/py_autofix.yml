name: autofix.ci

on:
  pull_request:
    paths:
      - "**/*.py"
      - "src/lfx/src/lfx/components/**"
      - "scripts/build_component_index.py"
    types: [opened, synchronize, reopened, labeled]

# Serialize generators that push to the same PR branch. Bot-triggered follow-up
# runs use their own group so they cannot replace a pending user-triggered run.
concurrency:
  group: pr-generator-writes-${{ github.event.pull_request.number }}-${{ github.actor != 'github-actions[bot]' && 'writer' || github.run_id }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

permissions:
  contents: read
  pull-requests: read

# AUTOFIX_TOKEN is optional. When absent (or on forks), jobs validate generated
# files without writing. A configured PAT/App token may push and trigger checks
# for the new PR head SHA; GITHUB_TOKEN is deliberately never used for pushes.
jobs:
  lint:
    name: Run Ruff Check and Format
    if: github.event.action != 'labeled' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
          prune-cache: false

      - name: Apply Ruff fixes
        run: |
          uv run ruff check --fix-only .
          uv run ruff format . --config pyproject.toml

      - name: Commit Python autofixes
        if: github.event.pull_request.head.repo.fork == false && env.AUTOFIX_TOKEN != ''
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "Python sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Python autofixes"
          git push origin "HEAD:${HEAD_REF}"

      - name: Validate Python formatting
        if: github.event.pull_request.head.repo.fork || env.AUTOFIX_TOKEN == ''
        run: git diff --exit-code

  update-starter-projects:
    name: Update Starter Projects
    needs: lint
    if: >-
      github.event.action != 'labeled'
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Setup Environment
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
          prune-cache: false

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -e .

      - name: Run starter projects update
        run: uv run python scripts/ci/update_starter_projects.py

      - name: Commit refreshed starter projects
        if: github.event.pull_request.head.repo.fork == false && env.AUTOFIX_TOKEN != ''
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/backend/base/langflow/initial_setup/starter_projects; then
            echo "Starter projects are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/base/langflow/initial_setup/starter_projects
          git commit -m "chore: refresh starter projects"
          git push origin "HEAD:${HEAD_REF}"

      - name: Validate starter projects
        if: github.event.pull_request.head.repo.fork || env.AUTOFIX_TOKEN == ''
        run: git diff --exit-code -- src/backend/base/langflow/initial_setup/starter_projects

  update-component-index:
    name: Update Component Index
    needs: [lint, update-starter-projects]
    if: >-
      always()
      && github.actor != 'github-actions[bot]'
      && (github.event.action != 'labeled' || github.event.label.name == 'fix-index')
      && (
        (github.event.action != 'labeled'
          && needs.lint.result == 'success'
          && needs.update-starter-projects.result == 'success')
        || (github.event.action == 'labeled' && github.event.label.name == 'fix-index')
      )
    runs-on: ubuntu-latest
    env:
      AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Merge base branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "${{ github.event.pull_request.base.repo.clone_url }}"
          git fetch --no-tags upstream "${{ github.base_ref }}"
          git merge upstream/${{ github.base_ref }} --no-edit || {
            CONFLICTED=$(git diff --name-only --diff-filter=U)

            if echo "$CONFLICTED" | grep -v component_index.json | grep -q .; then
              echo "::error::Merge conflicts in non-generated files require manual resolution"
              git merge --abort
              exit 1
            fi

            git checkout --theirs src/lfx/src/lfx/_assets/component_index.json
            git add src/lfx/src/lfx/_assets/component_index.json
            GIT_EDITOR=true git merge --continue
          }

      - name: Setup Environment
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: latest-known
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ env.PYTHON_VERSION }}
          prune-cache: false

      - name: Install dependencies
        run: uv sync --dev --project .

      - name: Build component index
        env:
          LFX_DEV: "1"
        run: make build_component_index

      - name: Commit refreshed component index
        if: github.event.pull_request.head.repo.fork == false && env.AUTOFIX_TOKEN != ''
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/lfx/src/lfx/_assets/component_index.json; then
            echo "Component index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lfx/src/lfx/_assets/component_index.json
          git commit -m "chore: refresh component index"
          git push origin "HEAD:${HEAD_REF}"

      - name: Validate component index
        if: github.event.pull_request.head.repo.fork || env.AUTOFIX_TOKEN == ''
        run: git diff --exit-code -- src/lfx/src/lfx/_assets/component_index.json
