name: Channel Production Phase 2 Finalize

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/channel-production-phase2-finalize.yml"
      - ".github/scripts/finalize_channel_production_phase2.py"

permissions:
  contents: write

concurrency:
  group: channel-production-phase2-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Generate hardened phase two runtime
        run: python .github/scripts/finalize_channel_production_phase2.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format and lint phase two runtime
        run: |
          uvx --quiet ruff format \
            src/backend/base/langflow/channels/services \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_production_access_context.py
          uvx --quiet ruff check --fix \
            --config src/backend/base/langflow/channels/ruff.toml \
            src/backend/base/langflow/channels/services \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/services/database/models/channel/crud.py
          uvx --quiet ruff check --fix \
            --config src/backend/tests/unit/channels/ruff.toml \
            src/backend/tests/unit/channels/test_production_access_context.py
          uvx --quiet ruff check \
            --config src/backend/base/langflow/channels/ruff.toml \
            src/backend/base/langflow/channels/services \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/services/database/models/channel/crud.py
          uvx --quiet ruff check \
            --config src/backend/tests/unit/channels/ruff.toml \
            src/backend/tests/unit/channels/test_production_access_context.py

      - name: Compile phase two runtime
        run: |
          python -m compileall -q \
            src/backend/base/langflow/channels/services \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_production_access_context.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run phase two regression tests
        id: tests
        shell: bash
        env:
          PYTHONPATH: src/backend/base
        run: |
          set +e
          uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_production_access_context.py \
            src/backend/tests/unit/channels/test_binding.py \
            src/backend/tests/unit/channels/test_command_routing.py \
            src/backend/tests/unit/channels/test_dispatch.py \
            src/backend/tests/unit/channels/test_workflow_response.py \
            src/backend/tests/unit/channels/test_channel_core_workflow.py \
            src/backend/tests/unit/channels/test_models.py \
            2>&1 | tee /tmp/channel-production-phase2-finalize-tests.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload phase two regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-phase2-finalize-tests
          path: /tmp/channel-production-phase2-finalize-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop when phase two tests fail
        if: steps.tests.outputs.status != '0'
        run: exit 1

      - name: Remove one-shot resources
        run: |
          rm -f .github/scripts/apply_channel_production_phase2.py
          rm -f .github/scripts/finalize_channel_production_phase2.py
          rm -f .github/workflows/channel-production-phase2.yml
          rm -f .github/workflows/channel-production-phase2-finalize.yml

      - name: Commit phase two runtime
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): add production access and context runtime"
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:${HEAD_REF}"
