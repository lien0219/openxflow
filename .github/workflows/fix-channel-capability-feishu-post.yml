name: Fix Channel Capability Feishu Post

on:
  push:
    branches:
      - feature/channel-gateway
    paths:
      - .github/workflows/fix-channel-capability-feishu-post.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out channel branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Add paragraph-preserving Feishu patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_channel_capability_response_scope.py')
          content = path.read_text(encoding='utf-8')
          marker = 'TEST_DISPATCH = "src/backend/tests/unit/channels/test_dispatch.py"\n'
          block = '''FEISHU = "src/backend/base/langflow/channels/adapters/feishu.py"
          replace_once(
              FEISHU,
              """        normalized = " ".join(cleaned.split())
                  return normalized or None
          """,
              """        normalized_lines = [" ".join(line.split()) for line in cleaned.splitlines()]
                  normalized = "\\n".join(line for line in normalized_lines if line)
                  return normalized or None
          """,
              label="preserve Feishu post paragraphs",
          )

          TEST_DISPATCH = "src/backend/tests/unit/channels/test_dispatch.py"
          '''
          if 'label="preserve Feishu post paragraphs"' not in content:
              if marker not in content:
                  raise SystemExit('test dispatch marker not found')
              content = content.replace(marker, block, 1)
              path.write_text(content, encoding='utf-8')
          PY
          rm .github/workflows/fix-channel-capability-feishu-post.yml

      - name: Commit parser rollout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/apply_channel_capability_response_scope.py .github/workflows/fix-channel-capability-feishu-post.yml
          git commit -m "fix(channels): preserve Feishu post paragraphs"
          git push origin HEAD:feature/channel-gateway
