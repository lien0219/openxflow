name: autofix.ci

on:
  pull_request:
    paths:
      - "src/frontend/**"

# Share the PR-branch writer lock with Python and backend string generators.
concurrency:
  group: pr-generator-writes-${{ github.event.pull_request.number }}-${{ github.actor != 'github-actions[bot]' && 'writer' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22"

jobs:
  autofix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      # Optional fine-grained PAT or GitHub App token with contents:write.
      # Unlike GITHUB_TOKEN, its pushes trigger checks for the new PR head SHA.
      AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Run Biome
        run: npm run format
        working-directory: src/frontend

      - name: Commit frontend autofixes
        if: github.event.pull_request.head.repo.fork == false && env.AUTOFIX_TOKEN != ''
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- src/frontend; then
            echo "Frontend sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend
          git commit -m "style: apply frontend autofixes"
          git push origin "HEAD:${HEAD_REF}"

      - name: Validate frontend formatting
        if: github.event.pull_request.head.repo.fork || env.AUTOFIX_TOKEN == ''
        run: git diff --exit-code -- src/frontend
