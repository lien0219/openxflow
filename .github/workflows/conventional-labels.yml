# Warning, do not check out untrusted code with
# the pull_request_target event.
name: Label PRs with Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize]
  merge_group:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate the pull request
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_DRAFT" == "true" || "$PR_AUTHOR_TYPE" == "Bot" ]]; then
            echo "Skipping validation for draft or bot pull request."
            exit 0
          fi

          conventional_pattern='^[a-z][a-z0-9-]*(\([^)]+\))?!?: .+$'
          echo "PR title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ $conventional_pattern ]]; then
            echo "PR title must follow Conventional Commits: type(scope): description"
            exit 1
          fi

          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "PR body must not be empty."
            exit 1
          fi

  label:
    needs: validate-pr
    name: Label PR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.user.type != 'Bot' }}
    steps:
      - uses: bcoe/conventional-release-labels@v1
        with:
          type_labels: '{"feat": "enhancement","fix": "bug","docs": "documentation","style": "style","refactor": "refactor","perf": "performance","test": "test","chore": "chore","build": "build"}'
