name: Channel Production Phase 2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/channel-production-phase2.yml"
      - ".github/scripts/apply_channel_production_phase2.py"

permissions:
  contents: write

concurrency:
  group: channel-production-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Correct phase two patch markers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_channel_production_phase2.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              '"    def _resolve_default_flow_id(\\n"': '"    def _resolve_default_flow_id("',
              '"    async def _send_processing_message(\\n"': '"    async def _send_processing_message("',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"dispatch boundary marker not found: {old}")
              content = content.replace(old, new, 1)
          for name in (
              "access_control",
              "context_service",
              "binding",
              "workflow",
              "execution_logs",
              "handle_block",
              "custom_block",
              "commands_block",
              "unknown_block",
              "execute_block",
              "context_block",
              "policy_test",
          ):
              converted = False
              for quote in ("'''", '\"\"\"'):
                  old = f"{name} = {quote}"
                  new = f"{name} = r{quote}"
                  if old in content:
                      content = content.replace(old, new, 1)
                      converted = True
                      print(f"made {name} raw")
                      break
              if not converted:
                  print(f"skipped raw conversion for {name}")
          path.write_text(content, encoding="utf-8")
          PY

      - name: Apply production access and context runtime
        id: apply
        shell: bash
        run: |
          set +e
          python .github/scripts/apply_channel_production_phase2.py 2>&1 | tee /tmp/channel-production-phase2.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-phase2-diagnostics
          path: /tmp/channel-production-phase2.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop when patch failed
        if: steps.apply.outputs.status != '0'
        run: exit 1

      - name: Harden runtime compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          access_path = Path("src/backend/base/langflow/channels/services/access_control.py")
          access = access_path.read_text(encoding="utf-8")
          old = '''def effective_access_policy(
              connection: ChannelConnection,
              binding: ChannelConversationBinding | None,
          ) -> str:
              if binding is not None and binding.access_policy != ChannelAccessPolicy.INHERIT.value:
                  return binding.access_policy
              return connection.access_policy


          def effective_context_mode(
              connection: ChannelConnection,
              binding: ChannelConversationBinding | None,
          ) -> str:
              if binding is not None and binding.context_mode != ChannelContextMode.INHERIT.value:
                  return binding.context_mode
              return connection.default_context_mode
          '''
          new = '''def effective_access_policy(
              connection: ChannelConnection,
              binding: ChannelConversationBinding | None,
          ) -> str:
              binding_policy = getattr(binding, "access_policy", ChannelAccessPolicy.INHERIT.value)
              if binding is not None and binding_policy != ChannelAccessPolicy.INHERIT.value:
                  return binding_policy
              return getattr(connection, "access_policy", ChannelAccessPolicy.HYBRID.value)


          def effective_context_mode(
              connection: ChannelConnection,
              binding: ChannelConversationBinding | None,
          ) -> str:
              binding_mode = getattr(binding, "context_mode", ChannelContextMode.INHERIT.value)
              if binding is not None and binding_mode != ChannelContextMode.INHERIT.value:
                  return binding_mode
              return getattr(connection, "default_context_mode", ChannelContextMode.ISOLATED.value)
          '''
          if old not in access:
              raise SystemExit("policy fallback block not found")
          access_path.write_text(access.replace(old, new, 1), encoding="utf-8")

          dispatch_path = Path("src/backend/base/langflow/channels/services/dispatch.py")
          dispatch = dispatch_path.read_text(encoding="utf-8")
          dispatch = dispatch.replace("import asyncio\n", "import asyncio\nimport inspect\n", 1)

          old_prepare = '''        prepared_input = await prepare_channel_input(
              self.session,
              connection=self.connection,
              binding=binding,
              event=event,
              session_id=session_id,
              input_value=input_value,
          )
          '''
          new_prepare = '''        prepared_input = input_value
          if self.session is not None:
              prepared_input = await prepare_channel_input(
                  self.session,
                  connection=self.connection,
                  binding=binding,
                  event=event,
                  session_id=session_id,
                  input_value=input_value,
              )
          '''
          if old_prepare not in dispatch:
              raise SystemExit("prepared input block not found")
          dispatch = dispatch.replace(old_prepare, new_prepare, 1)

          old_commit = '''        await self.session.commit()
          processing_message_id = await self._send_processing_message(event)
          '''
          new_commit = '''        if self.session is not None:
              await self.session.commit()
          processing_message_id = await self._send_processing_message(event)
          '''
          if old_commit not in dispatch:
              raise SystemExit("pre-workflow commit block not found")
          dispatch = dispatch.replace(old_commit, new_commit, 1)

          old_execute = '''            response = await self.workflow_executor.execute(
                  event=event,
                  user=principal.user,
                  flow_identifier=flow_identifier,
                  input_value=prepared_input,
                  session_id=session_id,
                  execution_identity_type=principal.identity_type,
                  channel_context=channel_context,
              )
          '''
          new_execute = '''            executor_kwargs: dict[str, Any] = {
                  "event": event,
                  "user": principal.user,
                  "flow_identifier": flow_identifier,
                  "input_value": prepared_input,
                  "channel_context": channel_context,
              }
              executor_parameters = inspect.signature(self.workflow_executor.execute).parameters
              if "session_id" in executor_parameters:
                  executor_kwargs["session_id"] = session_id
              if "execution_identity_type" in executor_parameters:
                  executor_kwargs["execution_identity_type"] = principal.identity_type
              response = await self.workflow_executor.execute(**executor_kwargs)
          '''
          if old_execute not in dispatch:
              raise SystemExit("workflow executor block not found")
          dispatch = dispatch.replace(old_execute, new_execute, 1)

          old_record = '''            await record_channel_response(
                  self.session,
                  connection=self.connection,
                  binding=binding,
                  event=event,
                  session_id=session_id,
                  response=response,
              )
              await self.session.commit()
          '''
          new_record = '''            if self.session is not None:
                  await record_channel_response(
                      self.session,
                      connection=self.connection,
                      binding=binding,
                      event=event,
                      session_id=session_id,
                      response=response,
                  )
                  await self.session.commit()
          '''
          if old_record not in dispatch:
              raise SystemExit("response context block not found")
          dispatch_path.write_text(dispatch.replace(old_record, new_record, 1), encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format and lint changed Python
        id: lint
        shell: bash
        run: |
          set +e
          {
            uvx --quiet ruff format \
              src/backend/base/langflow/channels/services \
              src/backend/base/langflow/api/v1/channels.py \
              src/backend/base/langflow/services/database/models/channel/crud.py \
              src/backend/tests/unit/channels/test_production_access_context.py
            format_status=$?
            uvx --quiet ruff check --fix \
              --config src/backend/base/langflow/channels/ruff.toml \
              src/backend/base/langflow/channels/services \
              src/backend/base/langflow/api/v1/channels.py \
              src/backend/base/langflow/services/database/models/channel/crud.py
            production_status=$?
            uvx --quiet ruff check --fix \
              --config src/backend/tests/unit/channels/ruff.toml \
              src/backend/tests/unit/channels/test_production_access_context.py
            test_status=$?
            status=$((format_status || production_status || test_status))
            echo "status=${status}" >> "$GITHUB_OUTPUT"
            exit 0
          } 2>&1 | tee /tmp/channel-production-phase2-lint.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-phase2-lint
          path: /tmp/channel-production-phase2-lint.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop when lint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1

      - name: Compile changed Python
        run: |
          python -m compileall -q \
            src/backend/base/langflow/channels/services \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/services/database/models/channel/crud.py \
            src/backend/tests/unit/channels/test_production_access_context.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run production access and context tests
        id: tests
        shell: bash
        env:
          PYTHONPATH: src/backend/base
        run: |
          set +e
          uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_production_access_context.py \
            src/backend/tests/unit/channels/test_binding.py \
            src/backend/tests/unit/channels/test_command_routing.py \
            src/backend/tests/unit/channels/test_dispatch.py \
            src/backend/tests/unit/channels/test_workflow_response.py \
            src/backend/tests/unit/channels/test_channel_core_workflow.py \
            src/backend/tests/unit/channels/test_models.py \
            2>&1 | tee /tmp/channel-production-phase2-tests.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-phase2-tests
          path: /tmp/channel-production-phase2-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Stop when tests failed
        if: steps.tests.outputs.status != '0'
        run: exit 1

      - name: Remove one-shot resources
        run: |
          rm .github/scripts/apply_channel_production_phase2.py
          rm .github/workflows/channel-production-phase2.yml

      - name: Commit production runtime upgrade
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): add production access and context runtime"
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:${HEAD_REF}"
