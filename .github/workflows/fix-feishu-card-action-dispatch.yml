name: Fix Feishu Card Action Dispatch

on:
  push:
    branches:
      - feature/channel-gateway
    paths:
      - ".github/workflows/fix-feishu-card-action-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-feishu-card-action-dispatch
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src/backend/base
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Feishu card action fix
        run: python .github/scripts/fix_feishu_card_action_dispatch.py

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            src/backend/base/pyproject.toml

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Ruff changed code
        run: |
          uvx --quiet ruff check --config src/backend/base/langflow/channels/ruff.toml --output-format concise \
            src/backend/base/langflow/channels/services/dispatch.py \
            src/backend/base/langflow/api/v1/channel_webhooks.py
          uvx --quiet ruff check --config src/backend/tests/unit/channels/ruff.toml --output-format concise \
            src/backend/tests/unit/channels/test_dispatch.py \
            src/backend/tests/unit/channels/test_channel_webhook_api.py

      - name: Run focused regressions
        run: >-
          uv run --frozen --project src/backend/base --group dev
          pytest -q --tb=short
          --confcutdir=src/backend/tests/unit/channels
          src/backend/tests/unit/channels/test_dispatch.py
          src/backend/tests/unit/channels/test_feishu.py
          src/backend/tests/unit/channels/test_channel_webhook_api.py
          src/backend/tests/unit/channels/test_command_routing.py

      - name: Compile changed modules
        run: >-
          python -m compileall -q
          src/backend/base/langflow/channels/services/dispatch.py
          src/backend/base/langflow/api/v1/channel_webhooks.py
          src/backend/tests/unit/channels/test_dispatch.py
          src/backend/tests/unit/channels/test_channel_webhook_api.py

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(feishu): execute card action commands reliably"
          git push origin HEAD:feature/channel-gateway
