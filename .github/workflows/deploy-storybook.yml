name: Deploy Storybook to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**/*.stories.*'
      - 'src/frontend/.storybook/**'
      - 'src/frontend/package.json'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy Storybook
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: cd src/frontend && npm ci

      - name: Build Storybook
        run: cd src/frontend && npm run build-storybook

      - name: Check Pages credentials
        id: pages_token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [[ -n "$PAGES_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Pages configuration
        id: pages
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput('enabled', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('enabled', 'false');
                core.notice('GitHub Pages is not enabled for this repository.');
              } else {
                throw error;
              }
            }

      - name: Setup Pages
        if: steps.pages.outputs.enabled == 'true' || steps.pages_token.outputs.configured == 'true'
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ steps.pages_token.outputs.configured == 'true' }}

      - name: Upload artifact
        if: steps.pages.outputs.enabled == 'true' || steps.pages_token.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true
          path: src/frontend/storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true' || steps.pages_token.outputs.configured == 'true'
        uses: actions/deploy-pages@v5

      - name: Report Pages deployment skipped
        if: steps.pages.outputs.enabled != 'true' && steps.pages_token.outputs.configured != 'true'
        run: |
          echo "::warning::Storybook was built, but GitHub Pages deployment was skipped. Enable Pages in repository settings or provide the PAGES_TOKEN secret."
