name: Channel Production Observability

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: channel-production-observability
  cancel-in-progress: true

jobs:
  apply-test-commit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out channel branch
        uses: actions/checkout@v4
        with:
          ref: feature/channel-gateway
          fetch-depth: 0

      - name: Apply observability and audit runtime
        shell: bash
        run: |
          set -o pipefail
          python .github/scripts/patch_channel_observability_rollout.py
          python .github/scripts/apply_channel_observability_runtime.py \
            2>&1 | tee /tmp/channel-observability-apply.log

      - name: Upload application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-observability-apply-diagnostics
          path: /tmp/channel-observability-apply.log
          if-no-files-found: error
          retention-days: 3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Format observability runtime
        run: |
          uvx --quiet ruff format \
            src/backend/base/langflow/api/router.py \
            src/backend/base/langflow/api/v1/__init__.py \
            src/backend/base/langflow/api/v1/channel_admin.py \
            src/backend/base/langflow/api/v1/channel_management.py \
            src/backend/base/langflow/api/v1/channel_observability.py \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/alembic/versions/f3a6c9e2b4d7_add_channel_message_and_config_audit.py \
            src/backend/base/langflow/channels/services/configuration_audit.py \
            src/backend/base/langflow/channels/services/dispatch.py \
            src/backend/base/langflow/channels/services/execution_logs.py \
            src/backend/base/langflow/channels/services/gateway.py \
            src/backend/base/langflow/channels/services/message_records.py \
            src/backend/base/langflow/channels/services/observability.py \
            src/backend/base/langflow/services/database/models/__init__.py \
            src/backend/base/langflow/services/database/models/channel/__init__.py \
            src/backend/base/langflow/services/database/models/channel/audit_model.py \
            src/backend/base/langflow/services/database/models/channel/message_model.py \
            src/backend/tests/unit/channels/test_channel_migrations_sqlite.py \
            src/backend/tests/unit/channels/test_channel_observability.py

      - name: Lint observability runtime
        shell: bash
        run: |
          set -o pipefail
          {
            uvx --quiet ruff check --fix \
              --config src/backend/base/pyproject.toml \
              src/backend/base/langflow/api/router.py \
              src/backend/base/langflow/api/v1/__init__.py \
              src/backend/base/langflow/api/v1/channel_admin.py \
              src/backend/base/langflow/api/v1/channel_management.py \
              src/backend/base/langflow/api/v1/channel_observability.py \
              src/backend/base/langflow/api/v1/channels.py \
              src/backend/base/langflow/alembic/versions/f3a6c9e2b4d7_add_channel_message_and_config_audit.py \
              src/backend/base/langflow/services/database/models/__init__.py
            uvx --quiet ruff check --fix \
              --config src/backend/base/langflow/channels/ruff.toml \
              src/backend/base/langflow/channels/services/configuration_audit.py \
              src/backend/base/langflow/channels/services/dispatch.py \
              src/backend/base/langflow/channels/services/execution_logs.py \
              src/backend/base/langflow/channels/services/gateway.py \
              src/backend/base/langflow/channels/services/message_records.py \
              src/backend/base/langflow/channels/services/observability.py \
              src/backend/base/langflow/services/database/models/channel/__init__.py \
              src/backend/base/langflow/services/database/models/channel/audit_model.py \
              src/backend/base/langflow/services/database/models/channel/message_model.py
            uvx --quiet ruff check --fix \
              --config src/backend/tests/unit/channels/ruff.toml \
              src/backend/tests/unit/channels/test_channel_migrations_sqlite.py \
              src/backend/tests/unit/channels/test_channel_observability.py
          } 2>&1 | tee /tmp/channel-observability-ruff.log

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-observability-ruff-diagnostics
          path: /tmp/channel-observability-ruff.log
          if-no-files-found: error
          retention-days: 3

      - name: Compile observability runtime
        run: |
          python -m compileall -q \
            src/backend/base/langflow/api/v1/channel_admin.py \
            src/backend/base/langflow/api/v1/channel_management.py \
            src/backend/base/langflow/api/v1/channel_observability.py \
            src/backend/base/langflow/api/v1/channels.py \
            src/backend/base/langflow/alembic/versions/f3a6c9e2b4d7_add_channel_message_and_config_audit.py \
            src/backend/base/langflow/channels/services/configuration_audit.py \
            src/backend/base/langflow/channels/services/dispatch.py \
            src/backend/base/langflow/channels/services/execution_logs.py \
            src/backend/base/langflow/channels/services/gateway.py \
            src/backend/base/langflow/channels/services/message_records.py \
            src/backend/base/langflow/channels/services/observability.py \
            src/backend/base/langflow/services/database/models/channel/audit_model.py \
            src/backend/base/langflow/services/database/models/channel/message_model.py \
            src/backend/tests/unit/channels/test_channel_migrations_sqlite.py \
            src/backend/tests/unit/channels/test_channel_observability.py

      - name: Sync backend test environment
        run: uv sync --quiet --frozen --project src/backend/base --group dev

      - name: Run observability and channel regression tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src/backend/base uv run --frozen --project src/backend/base --group dev \
            pytest -q --tb=short \
            --confcutdir=src/backend/tests/unit/channels \
            src/backend/tests/unit/channels/test_channel_observability.py \
            src/backend/tests/unit/channels/test_channel_migrations_sqlite.py \
            src/backend/tests/unit/channels/test_gateway.py \
            src/backend/tests/unit/channels/test_dispatch.py \
            src/backend/tests/unit/channels/test_models.py \
            src/backend/tests/unit/channels/test_outbound_delivery.py \
            src/backend/tests/unit/channels/test_outbound_delivery_lifecycle.py \
            src/backend/tests/unit/channels/test_durable_webhook_jobs_sqlite.py \
            src/backend/tests/unit/channels/test_channel_core_workflow.py \
            2>&1 | tee /tmp/channel-observability-pytest.log

      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-observability-pytest-diagnostics
          path: /tmp/channel-observability-pytest.log
          if-no-files-found: error
          retention-days: 3

      - name: Remove one-shot rollout resources
        run: |
          rm -f .github/scripts/apply_channel_observability_runtime.py
          rm -f .github/scripts/patch_channel_observability_rollout.py
          rm -f .github/workflows/channel-production-observability.yml

      - name: Commit production observability runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(channels): add message center metrics retries and config audit"
          git pull --rebase origin feature/channel-gateway
          git push origin HEAD:feature/channel-gateway
